name: Deploy Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build editor app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: serendipity

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-30
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: serendipity/pnpm-lock.yaml

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: serendipity

      - name: Build editor app
        run: pnpm --filter @serendipity/editor-app... build
        working-directory: serendipity

      - name: Add GitHub Pages files
        run: |
          cp serendipity/editor/app/build/index.html serendipity/editor/app/build/404.html
          echo "serendipitous.dev" > serendipity/editor/app/build/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: serendipity/editor/app/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
